<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game War OOP</title>
    <link rel="stylesheet" href="css/style.css" />
    <style></style>
</head>

<body>

    <div class="box">
        <div class="person">
            <div class="nartoo-health progress">
                <span></span>
            </div>
            <h2>Nartoo</h2>
            <img src="images/naruto.jpg" alt="">
            <div class="btns">
                <button id="nartoo-attack">Attack</button>
                <button id="nartoo-make-health">Health</button>
            </div>
            <p class="nartoo-alive"></p>
        </div>

        <div class="person">

            <div class="superman-health progress">
                <span></span>
            </div>
            <h2>superman</h2>
            <img src="images/superman.jpg" alt="">
            <div class="btns">
                <button id="superman-attack">Attack</button>
                <button id="superman-make-health">Health</button>
            </div>
            <p class="superman-alive"></p>

        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
